# CUDA synthetic evaluator acceptance only; not LEVIR research.
# Zero workers keep all 45 tiny smoke conditions fast; separate tests cover spawn workers.
# Synthetic CUDA engineering check only; never a research result.
# Exercises train/val-only development with the stable accelerated runtime.
experiment:
  name: synthetic_validation_evaluator_20260913
  kind: smoke
  seed: 42
  output_dir: ../runs/smoke_validation_evaluator_20260913/base_run
runtime:
  device: cuda
  deterministic: true
  num_threads: 4
  memory_format: channels_last
data:
  root: ../runs/smoke_validation_evaluator_20260913/data
  splits: {train: train, val: val, test: test}
  folders: {image_a: A, image_b: B, mask: label}
  extensions: [.png]
  expected_pairs: {train: 4, val: 2, test: 2}
  expected_image_size: 64
  tile_size: 64
  label_values: [0, 255]
  label_decode: author_uint8_floor255
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
model:
  encoder_weights: null
  weights_cache: ../weights/torch_hub
  decoder_channels: 64
  normalization_groups: 8
research: {pse: false, pcdc: false, cpc: false}
train:
  epochs: 1
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  adam_betas: [0.9, 0.999]
  min_learning_rate: 0.000001
  amp: true
  grad_clip_norm: 1.0
loss: {bce_weight: 1.0, dice_weight: 1.0, dice_smooth: 1.0}
evaluation:
  threshold: 0.5
  checkpoint_metric: f1
  run_test_after_training: false

