experiment:
  name: levir_clean_r18_author_floor255
  kind: research
  seed: 42
  output_dir: E:\new research\detection\runs\levir_clean_r18_author_floor255_seed42
runtime:
  device: cuda
  deterministic: true
  num_threads: 4
data:
  root: E:\thesis\datasets\LEVIR-CD
  splits:
    train: train
    val: val
    test: test
  folders:
    image_a: A
    image_b: B
    mask: label
  extensions:
  - .png
  expected_pairs:
    train: 445
    val: 64
    test: 128
  expected_image_size: 1024
  tile_size: 256
  label_values:
  - 0
  - 255
  label_decode: author_uint8_floor255
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  encoder_weights: null
  weights_cache: E:\new research\detection\weights\torch_hub
  decoder_channels: 64
  normalization_groups: 8
research:
  pse: false
  pcdc: false
  cpc: false
train:
  epochs: 100
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  adam_betas:
  - 0.9
  - 0.999
  min_learning_rate: 1.0e-06
  amp: false
  grad_clip_norm: 1.0
loss:
  bce_weight: 1.0
  dice_weight: 1.0
  dice_smooth: 1.0
evaluation:
  threshold: 0.5
  checkpoint_metric: f1
