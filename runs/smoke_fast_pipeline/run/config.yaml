experiment:
  name: synthetic_fast_pipeline_smoke
  kind: smoke
  seed: 42
  output_dir: E:\new research\detection\runs\smoke_fast_pipeline\run
runtime:
  device: cuda
  deterministic: true
  num_threads: 4
  memory_format: channels_last
data:
  root: E:\new research\detection\runs\smoke_fast_pipeline\data
  splits:
    train: train
    val: val
    test: test
  folders:
    image_a: A
    image_b: B
    mask: label
  extensions:
  - .png
  expected_pairs:
    train: 2
    val: 1
    test: 1
  expected_image_size: 64
  tile_size: 64
  label_values:
  - 0
  - 255
  label_decode: author_uint8_floor255
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  encoder_weights: null
  weights_cache: E:\new research\detection\weights\torch_hub
  decoder_channels: 64
  normalization_groups: 8
research:
  pse: false
  pcdc: false
  cpc: false
train:
  epochs: 1
  batch_size: 2
  eval_batch_size: 2
  num_workers: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  adam_betas:
  - 0.9
  - 0.999
  min_learning_rate: 1.0e-06
  amp: true
  grad_clip_norm: 1.0
loss:
  bce_weight: 1.0
  dice_weight: 1.0
  dice_smooth: 1.0
evaluation:
  threshold: 0.5
  checkpoint_metric: f1
